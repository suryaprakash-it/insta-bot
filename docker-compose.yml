services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yazh_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - yazh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yazh_booking"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/YazhBookingBot.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DATABASE_CONNECTION_STRING: "${DATABASE_CONNECTION_STRING:-Host=db;Port=5432;Database=yazh_booking;Username=postgres;Password=${POSTGRES_PASSWORD}}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"

  frontend:
    build:
      context: frontend/yazh-booking-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  yazh-postgres-data:
